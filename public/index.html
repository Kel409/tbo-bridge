<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bridge</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="topbar">
    <h1 id="title">Bridge</h1>
    <a id="mode-link" href="#"></a>
    <div id="account">
      <img id="account-avatar" alt="" src="/img/default-avatar.png">
      <span id="auth-bar"></span>
    </div>
    <p id="status"></p>
    <span id="clock"></span>
    <div id="auction"></div>
  </header>

  <!-- The table fills the screen. Seats hug the edges; played cards land in the center cross. -->
        <main id="table">
    <!-- Behind the cards: a spotlight on the active player and a faint trump emblem. -->
    <div id="spotlight"></div>
    <div id="trump-emblem"></div>

    <!-- One section per logical seat (N/E/S/W). ui.js assigns each a screen position so the viewer sits at the bottom. -->
    <section class="seat" id="seat-N"><div id="hand-N" class="hand"></div><h2 id="head-N" class="seat-name">North</h2><div class="call" id="call-N"></div><div class="seat-controls" id="ctl-N"></div></section>
    <section class="seat" id="seat-W"><h2 id="head-W" class="seat-name">West</h2><div id="hand-W" class="hand"></div><div class="call" id="call-W"></div><div class="seat-controls" id="ctl-W"></div></section>
    <div id="trick" class="trick"></div>
    <section class="seat" id="seat-E"><h2 id="head-E" class="seat-name">East</h2><div id="hand-E" class="hand"></div><div class="call" id="call-E"></div><div class="seat-controls" id="ctl-E"></div></section>
    <section class="seat" id="seat-S"><div id="hand-S" class="hand"></div><h2 id="head-S" class="seat-name">South</h2><div class="call" id="call-S"></div><div class="seat-controls" id="ctl-S"></div></section>
  </main>

  <footer id="bottombar">
    <div id="controls">
      <!-- A bid is a level (1-7) plus a strain. Pick the level with the stepper, then click a strain to bid it. -->
      <div id="bidding">
        <button id="level-down">&minus;</button>
        <span class="level-display">Level <strong id="level">1</strong></span>
        <button id="level-up">+</button>
        <button class="bid suit-C" data-strain="C">&clubs;</button>
        <button class="bid suit-D" data-strain="D">&diams;</button>
        <button class="bid suit-H" data-strain="H">&hearts;</button>
        <button class="bid suit-S" data-strain="S">&spades;</button>
        <button class="bid" data-strain="NT">NT</button>
        <button id="dbl">Double</button>
        <button id="redbl">Redouble</button>
        <button id="pass">Pass</button>
      </div>
      <button id="new-deal">New Deal</button>
      <button id="reset-all" title="Wipe scores and start over (temporary)">Reset</button>
      <button id="leave-seat" disabled>Leave Seat</button>
      <button id="spectate">Spectate</button>
      <label id="size-ctl" title="Card size">Size <input id="card-size" type="range" min="0.85" max="1.5" step="0.05"></label>
      <span id="suit-order" title="Drag to reorder the suits in your hand"></span>
    </div>
    <div id="scoreboard"></div>
  </footer>

  <!-- Scoreboard: the side tab toggles it during play; it also pops up after each deal. -->
  <button id="sb-toggle" aria-label="Toggle scoreboard">Scoreboard</button>
  <button id="bids-toggle" aria-label="Toggle bid history">Bids</button>
  <button id="colors-toggle" aria-label="Toggle colours">Colours</button>
  <div id="colors-overlay" hidden>
    <div id="colors-panel" role="dialog" aria-modal="true" aria-label="Colour scheme">
      <h2>Colours</h2>
      <p class="auth-hint">Pick three colours; the rest of the theme is shaded from them.</p>
      <label class="color-row">Background <input id="color-bg" type="color"></label>
      <label class="color-row">Text <input id="color-text" type="color"></label>
      <label class="color-row">Accent <input id="color-accent" type="color"></label>
      <div class="auth-actions">
        <button id="colors-reset">Reset to default</button>
        <button id="colors-close">Close</button>
      </div>
    </div>
  </div>
  <div id="bids-overlay" hidden>
    <div id="bids-panel" role="dialog" aria-modal="true" aria-label="Bid history">
      <h2>Bid order</h2>
      <div id="bids-content"></div>
      <button id="bids-close">Close</button>
    </div>
  </div>
  <div id="sb-overlay" hidden>
    <div id="sb-panel" role="dialog" aria-modal="true" aria-label="Scoreboard">
      <h2>Scoreboard</h2>
      <div id="sb-content"></div>
      <button id="sb-next">Next</button>
    </div>
  </div>

  <div id="auth-overlay" hidden>
    <div id="auth-panel" role="dialog" aria-modal="true" aria-label="Sign in">
      <h2>Sign in to play</h2>
      <p class="auth-hint">You can watch without an account, but you need one to sit at the table.</p>
      <input id="auth-username" type="text" placeholder="Username" autocomplete="username" maxlength="20">
      <input id="auth-password" type="password" placeholder="Password" autocomplete="current-password">
      <div id="auth-error" class="auth-error"></div>
      <div class="auth-actions">
        <button id="auth-login">Log in</button>
        <button id="auth-signup">Sign up</button>
        <button id="auth-close">Just watch</button>
      </div>
    </div>
  </div>

  <div id="profile-overlay" hidden>
    <div id="profile-panel" role="dialog" aria-modal="true" aria-label="Profile">
      <h2 id="profile-name">Profile</h2>
      <div class="profile-images">
        <div class="profile-slot">
          <img id="profile-avatar" class="pfp-circle" alt="" src="/img/default-avatar.png">
          <span>Photo</span>
        </div>
        <div class="profile-slot">
          <div id="profile-cardback" class="pfp-card">Card back</div>
          <span>Card back</span>
        </div>
      </div>
      <div id="profile-stats"></div>
      <h3 class="profile-h3">Match history</h3>
      <div id="profile-history"></div>
      <div class="profile-actions">
        <button id="profile-clear">Clear images</button>
        <button id="profile-logout">Log out</button>
      </div>
      <button id="profile-close">Close</button>
      <input id="avatar-input" type="file" accept="image/*" hidden>
      <input id="cardback-input" type="file" accept="image/*" hidden>
    </div>
  </div>

  <!-- Socket.IO client, served automatically by the server -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- type="module" enables import/export. Modules only load over http, not file://, which is why you must run a server. -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
